<!-- Semantica -->
<!-- en HTML, la semántica es el significado o la función que tiene cada
etiqueta y el contenido que contiene. Por ejemplo, <main> indica que dentro
está el contenido principal de la página -->

<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mi primer pagina web</title>
</head>
<body>
	<!--La combinacion de las etiquetas:-->
	<header>
	</header>
	<main>
	</main>
	<footer>
	</footer>
	<!-- Estas etiquetas semánticas forman una estructura común para organizar
     el contenido de la página: cabecera, contenido principal y pie. -->
</body>
</html>
