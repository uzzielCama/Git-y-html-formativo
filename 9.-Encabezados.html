<!-- Encabezados en HTML -->

<!-- Las etiquetas <h1> a <h6> representan encabezados
de distintos niveles. <h1> es el encabezado de mayor jerarquía
y <h6>, el de menor jerarquía. Se usan para organizar el contenido,
no solo para cambiar el tamaño o el énfasis del texto. -->

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mi primer pagina web</title>
</head>
<body>
	
	<header>
		<h1>Recetas de Cocina</h1>
	</header>

	<main>
		<h2>Recetas saladas</h2>

		<h2>Recetas dulces 
			<h3>
				Torta de Chocolate
			</h3>
			<h3>
				Flan casero
			</h3>
	</main>

	<footer></footer>

</body>
</html>
