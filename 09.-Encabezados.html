<!-- Estructura de ejemplo usando las etiquetas <header>, <main>, <footer>
     y los encabezados <h1> a <h6> -->
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mi primera página web</title>
</head>
<body>

	<header>
		<!-- Encabezado de nivel 1: título principal de la página -->
		<h1>Mi primera página web</h1>
	</header>

	<main>
		<!-- Encabezado de nivel 2: sección principal -->
		<h2>Contenido principal</h2>

		<!-- Encabezado de nivel 3: tema dentro de la sección -->
		<h3>Un tema</h3>

		<!-- Encabezado de nivel 4: subtema -->
		<h4>Un subtema</h4>

		<!-- Encabezado de nivel 5: detalle del subtema -->
		<h5>Un detalle</h5>

		<!-- Encabezado de nivel 6: nivel más específico de la jerarquía -->
		<h6>Un detalle aún más específico</h6>
	</main>

	<footer>
		2026 Mi primera página web
	</footer>

</body>
</html>
