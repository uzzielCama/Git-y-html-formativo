<!-- Metadatos de una página -->
<!-- Los metadatos describen información sobre la página y cómo debe interpretarse,
     como su codificación, quién la creó o de qué trata.
     Son parecidos a la etiqueta informativa de un producto, como una bolsa de papas
     o una botella de refresco. -->

<!DOCTYPE html>
<html lang="es">
	<head>
		<!-- Esta etiqueta indica la codificación de caracteres del documento HTML. -->
		<!-- charset: atributo que especifica qué codificación usa la página. -->
		<!-- UTF-8: codificación que permite mostrar correctamente letras con tildes y ñ, además de muchos otros caracteres y símbolos. 
		Sin esta declaración, el navegador podría interpretar mal la codificación y mostrar algunos caracteres de forma incorrecta.-->

		<meta charset="UTF 8">

		<!-- <meta>: etiqueta que proporciona información sobre la página. No necesita etiqueta de cierre.

		name="viewport": indica que la configuración se refiere al área visible de la página, llamada viewport.
		content="...": contiene las opciones de esa configuración:

		width=device-width: establece el ancho de la página según el ancho de la pantalla del dispositivo.
		initial-scale=1.0: establece el zoom inicial en 1, es decir, sin ampliación ni reducción.-->

		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
</html>
